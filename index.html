<!DOCTYPE html>
<html>
<head>
    <title>Matemágica</title>

    <link href="https://fonts.cdnfonts.com/css/60s-scoreboard" rel="stylesheet">

    <style>
        body{
            background-image: url('https://images.unsplash.com/photo-1522778119026-d647f0596c20?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover;
            background-position: center;
        }

        .fracao {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            font-size: 20px;
        }

        .topo {
            line-height: 1.2;
        }

        .button {
            background-color: white;
            border: none;
            color: black;
            padding: 16px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            transition-duration: 0.4s;
            cursor: pointer;
            width: 100%;
            border: 2px solid #081c15;
        }

        .button:hover {
            background-color: #00b4d8;
            color: white;
        }

        .button.wrong,
        .button.wrong:hover {
            background-color: red;
        }

        .linha {
            width: 100%;
            border-top: 2px solid black;
            margin: 2px 0;
        }

        .base {
            line-height: 1.2;
        }

        .campo-questao {
            display: flex;
            justify-content: center;
        }
        .campo-interno {
            border: 1px solid black;
            width: 50%;
            background-color:#caf0f8;
        }

        .grid-opcoes {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            padding: 10px;
        }

        .opcao {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .titulo-da-questao {
            align-items: center;
            padding-left: 5%;
            font-size: 20px;
        }

        .div-nova-questao{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .nova-questao{
            background-color: #03045e;
            color: white;
        }
        
        .nova-questao:hover {
            background-color: #48cae4;
            color: black;
        }

        .header {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            padding: 10px;
            align-items: center;
            justify-items: center;
        }

        .header-item {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .score {
            background-color: black;
            color: green;
            font-size: 30px;
            border-radius: 12px;
            font-family: '60s Scoreboard', sans-serif;
            width: 90%;
            max-width: 320px;
        }

        .selector {
            font-family: 'Courier New', monospace;
            font-size: 20px;
            width: 90%;
            max-width: 320px;
            background-color: black;
            color: green;
            font-family: '60s Scoreboard', sans-serif;
            border-radius: 12px;
        }

        .timer {
            font-family: 'Courier New', monospace;
            font-size: 30px;
            width: 90%;
            max-width: 320px;
            background-color: black;
            color: green;
            font-family: '60s Scoreboard', sans-serif;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-item">
            <select id="opcoes" onchange="selecionaTipoDeQuestao()" class="selector">
                <option value="somaSimples">Soma Simples</option>
                <option value="subtracaoSimples">Subtração Simples</option>
                <option value="multiplicacaoSimples">Multiplicação Simples</option>
                <option value="divisaoSimples">Divisão Simples</option>
                <option value="somaMultiplosDigitos">Soma com Múltiplos Dígitos</option>
                <option value="subtracaoMultiplosDigitos">Subtração com Múltiplos Dígitos</option>
                <option value="multiplicacaoMultiplosDigitos">Multiplicação com Múltiplos Dígitos</option>
                <option value="divisaoComMultiplosDigitos">Divisão com Múltiplos Dígitos</option>
                <option value="divisaoRacional">Divisão com resultado fracionado</option>
                <option value="expressoes">Expressões</option>
                <option value="simplificarFracao">Simplificar frações</option>
                <option value="expressaoDeFracao">Expressões de frações</option>
                <option value="equacoesSimples">Equações Simples</option>
                <option value="sistemasDeEquacoes">Sistemas de Equações</option>
                <option value="potenciacao">Potenciação</option>
                <option value="raizQuadrada">Raiz Quadrada</option>
                <option value="expressoesRaizPotenciacao">Expressões com raiz e potenciação</option>
                <option value="equacaoQuadraticaSimples">Equação Quadrática Simples</option>
            </select>
        </div>
    
        <div class="header-item score" id="score">
            C/E: 0/0
        </div>
        
        <div class="header-item timer" id="timer">
            timer: 60
        </div>

        <div class="header-item score" id="pontos">
            Score: 0
        </div>
    </div>

    <br><br>
    
    <div id="campo-questao" class="campo-questao">
        <div id="campo-interno" class="campo-interno"> 
            <div class="titulo-da-questao">
                <p id="texto-questao">2 + 2 = x</p>
            </div>

            <div class="grid-opcoes">
                <div class="opcao">
                    <button class="button" id="button-a" onclick="checaQuestao('a')"><p id="a">1</p></button><br>
                </div>
                
                <div class="opcao">
                    <button class="button" id="button-b" onclick="checaQuestao('b')"><p id="b">2</p></button><br>
                </div>
                <div class="opcao">
                    <button class="button" id="button-c" onclick="checaQuestao('c')"><p id="c">3</p></button><br>
                </div>
                <div class="opcao">
                    <button class="button" id="button-d" onclick="checaQuestao('d')"><p id="d">4</p></button><br>
                </div>
            </div>
            
            <p>&nbsp;Nota: arredonde os valores para 2 casas decimais</p>

            <br>
        
            <div class="div-nova-questao">
                <button class="button nova-questao" onclick="textoDaQuestao()">Nova questão</button>
            </div>
        </div>
    </div>

    <!--<img src="https://github.com/joaopedrolourencoaffonso/jungle-jump/blob/main/static/runner.gif?raw=true" alt="Runner GIF" style="position: fixed; bottom: 0; right: 0; width: 100px; height: auto;">-->


    <script>
        let respostaDaQuestao = 4;
        let tipoDeQuestao = "somaSimples";
        let tipoDeQuestaoAnterior = "somaSimples";
        let questoesCertas = 0;
        let totalQuestoes = 0;
        let pontos = 0;
        let tempoRestante = 60;
        atualizaQuestao();
        timer();

        function textoDaQuestao() {
            var paragraph = document.getElementById("texto-questao");

            // chama função
            if (tipoDeQuestao === "somaSimples") {
                questao = questaoSomaSimples(1,10);
            } else if (tipoDeQuestao === "subtracaoSimples") {
                questao = questaoSubtracaoSimples(6,10,1,5);
            } else if (tipoDeQuestao === "multiplicacaoSimples") {
                questao = multiplicacaoSimples(1,10);
            } else if (tipoDeQuestao === "divisaoSimples") {
                questao = divisaoSimples(1,20);
            } else if (tipoDeQuestao === "somaMultiplosDigitos") {
                questao = questaoSomaSimples(100,999);
            } else if (tipoDeQuestao === "subtracaoMultiplosDigitos") {
                questao = questaoSubtracaoSimples(500,999,100,499);
            } else if (tipoDeQuestao === "multiplicacaoMultiplosDigitos") {
                questao = multiplicacaoSimples(1,99);
            } else if (tipoDeQuestao === "divisaoComMultiplosDigitos") {
                questao = divisaoSimples(10,99);
            } else if (tipoDeQuestao === "divisaoRacional") {
                questao = divisaoRacional(10, 99);
            } else if (tipoDeQuestao === "expressoes") {
                questao = expressoes();
            } else if (tipoDeQuestao === "expressaoDeFracao") {
                questao = expressaoDeFracao();
            } else if (tipoDeQuestao === "simplificarFracao") {
                questao = simplificarFracao();
            } else if (tipoDeQuestao === "equacoesSimples") {
                questao = equacoesSimples();
            } else if (tipoDeQuestao === "sistemasDeEquacoes") {
                questao = sistemasDeEquacoes();
            } else if (tipoDeQuestao === "potenciacao") {
                questao = potenciacao();
            } else if (tipoDeQuestao === "raizQuadrada") {
                questao = raizQuadrada();
            } else if (tipoDeQuestao === "expressoesRaizPotenciacao") {
                questao = expressoesRaizPotenciacao();
            } else if (tipoDeQuestao === "equacaoQuadraticaSimples") {
                questao = equacaoQuadraticaSimples();
            } else if (tipoDeQuestao === "outro") {
                console.log(tipoDeQuestao)
            }

            var opcaoA = document.getElementById("button-a");
            var opcaoB = document.getElementById("button-b");
            var opcaoC = document.getElementById("button-c");
            var opcaoD = document.getElementById("button-d");

            opcaoA.classList.remove("wrong");
            opcaoB.classList.remove("wrong");
            opcaoC.classList.remove("wrong");
            opcaoD.classList.remove("wrong");

            paragraph.innerHTML = questao;

            tempoRestante = 60;
        }

        function atualizaQuestao() {
            setInterval(() => {
                if (tipoDeQuestaoAnterior != tipoDeQuestao) {
                    textoDaQuestao();
                    tempoRestante = 60;
                }
                tipoDeQuestaoAnterior = tipoDeQuestao;
            }, 1000);
        }

        function textoDasRespostas(vetorResposta) {
            var paragrafoA = document.getElementById("a");
            var paragrafoB = document.getElementById("b");
            var paragrafoC = document.getElementById("c");
            var paragrafoD = document.getElementById("d");

            paragrafoA.innerHTML = vetorResposta[0];
            paragrafoB.innerHTML = vetorResposta[1];
            paragrafoC.innerHTML = vetorResposta[2];
            paragrafoD.innerHTML = vetorResposta[3];
        }

        function questaoSomaSimples(min, max) {
            let primeiroNumero = getRandomInt(min, max);
            let segundoNumero = getRandomInt(min, max);
            let questao = `${primeiroNumero} + ${segundoNumero} = x`;
            respostaDaQuestao = primeiroNumero + segundoNumero;
            let vetorResposta = fazVetorResposta(respostaDaQuestao);
            
            // escreve respostas possíveis
            textoDasRespostas(vetorResposta);

            return questao;
        }

        function questaoSubtracaoSimples(min1, max1, min2, max2) {
            let primeiroNumero = getRandomInt(min1, max1);
            let segundoNumero = getRandomInt(min2, max2);
            let questao = `${primeiroNumero} - ${segundoNumero} = x`;
            respostaDaQuestao = primeiroNumero - segundoNumero;
            let vetorResposta = fazVetorResposta(respostaDaQuestao);
            
            // escreve respostas possíveis
            textoDasRespostas(vetorResposta);

            return questao;
        }

        function multiplicacaoSimples(min, max) {
            let primeiroNumero = getRandomInt(min, max);
            let segundoNumero = getRandomInt(min, max);
            let questao = `${primeiroNumero} x ${segundoNumero} = x`;
            respostaDaQuestao = primeiroNumero * segundoNumero;
            let vetorResposta = fazVetorResposta(respostaDaQuestao);
            
            // escreve respostas possíveis
            textoDasRespostas(vetorResposta);

            return questao;
        }

        function divisaoSimples(min, max) {
            respostaDaQuestao = getRandomInt(min, max);
            let segundoNumero = getRandomInt(min, max);
            let primeiroNumero = respostaDaQuestao * segundoNumero;
            let questao = `${primeiroNumero} ÷ ${segundoNumero} = x`;
            let vetorResposta = fazVetorResposta(respostaDaQuestao);
            
            // escreve respostas possíveis
            textoDasRespostas(vetorResposta);

            console.log("Resposta da questão: " + respostaDaQuestao);

            return questao;
        }

        function divisaoRacional(min, max) {
            while (true) {
                primeiroNumero = getRandomInt(min, max);
                segundoNumero = getRandomInt(min, max);
                if (primeiroNumero % segundoNumero > 0) {
                    break;
                }
            }
            respostaDaQuestao = primeiroNumero / segundoNumero;
            respostaDaQuestao = respostaDaQuestao.toFixed(2);
            let questao = `${primeiroNumero} ÷ ${segundoNumero} = x`;
            let vetorResposta = fazVetorResposta(respostaDaQuestao);
            
            // escreve respostas possíveis
            textoDasRespostas(vetorResposta);

            console.log("Resposta da questão: " + respostaDaQuestao);

            return questao;
        }

        function expressoes() {
            const tipos = [
                {
                    texto: "a + b - c + d",
                    calc: (a,b,c,d) => a + b - c + d
                },
                {
                    texto: "(a x b) - (c x d)",
                    calc: (a,b,c,d) => (a * b) - (c * d)
                },
                {
                    texto: "{[(2 x a) + (3 x b)] ÷ c} x d",
                    calc: (a,b,c,d) => ((2*a + 3*b) / c) * d
                },
                {
                    texto: "{(2 x a) + [(3 x b) ÷ c]} x d",
                    calc: (a,b,c,d) => (2*a + (3*b / c)) * d
                },
                {
                    texto: "(5 x a) ÷ (2 + b + c + d)",
                    calc: (a,b,c,d) => (5*a) / (2 + b + c + d)
                },
                {
                    texto: "[(a + b) ÷ c] x d",
                    calc: (a,b,c,d) => ((a + b) / c) * d
                },
                {
                    texto: "a x (b + c + d)",
                    calc: (a,b,c,d) => a * (b + c + d)
                },
                {
                    texto: "a x [(b + c) ÷ d]",
                    calc: (a,b,c,d) => a * ((b + c) / d)
                },
                {
                    texto: "a + b - c - d",
                    calc: (a,b,c,d) => a + b - c - d
                },
                {
                    texto: "a + b x c - d",
                    calc: (a,b,c,d) => a + b * c - d
                },
                {
                    texto: "a - (b x c ÷ d)",
                    calc: (a,b,c,d) => a - (b * c / d)
                },
                {
                    texto: "a x b x c ÷ d",
                    calc: (a,b,c,d) => a * b * c / d
                }
            ];

            const tipo = getRandomInt(0, tipos.length - 1);

            let a = getRandomInt(1,20);
            let b = getRandomInt(1,20);
            let c = getRandomInt(1,20);
            let d = getRandomInt(1,20);

            respostaDaQuestao = tipos[tipo].calc(a,b,c,d);
            respostaDaQuestao = Number(respostaDaQuestao.toFixed(2));
            let vetorResposta = fazVetorResposta(respostaDaQuestao);

            // escreve respostas possíveis
            textoDasRespostas(vetorResposta);

            let questao = tipos[tipo].texto.replaceAll("a", a).replaceAll("b", b).replaceAll("c", c).replaceAll("d", d);

            console.log("Resposta da questão:", respostaDaQuestao);

            return questao;
        }

        function equacoesSimples() {
            const tipos = [
                {
                    texto: "ax + b = c + d",
                    calc: (a,b,c,d) => (c + d - b) / a
                },
                {
                    texto: "ax + bx - c = d",
                    calc: (a,b,c,d) => (d + c) / (a + b)
                },
                {
                    texto: "ax + bx - cx = d",
                    calc: (a,b,c,d) => d / (a + b - c)
                },
                {
                    texto: "ax + b - c = dx",
                    calc: (a,b,c,d) => (c - b) / (a - d)
                },
                {
                    texto: "ax + b - c = d",
                    calc: (a,b,c,d) => (d + c - b) / a
                },
                {
                    texto: "a + b - c = dx",
                    calc: (a,b,c,d) => (c - b - a) / d
                },
                {
                    texto: "a + (b + 32)x - c = dx + 2",
                    calc: (a,b,c,d) => (a - c - 2) / (d - b - 32)
                },
                {
                    texto: "(a + b)x - c = d + 2",
                    calc: (a,b,c,d) => (d + 2 + c) / (a + b)
                },
                {
                    texto: "a + bx - c = 2*d + 2",
                    calc: (a,b,c,d) => (2*d + 2 + c - a) / b
                },
                {
                    texto: "a + bx - cx = d + 10",
                    calc: (a,b,c,d) => (d + 10 + c - a) / (b - c)
                }
            ];

            const tipo = getRandomInt(0, tipos.length - 1);

            let a = getRandomInt(1,20);
            let b = getRandomInt(1,20);
            let c = getRandomInt(1,20);
            let d = getRandomInt(1,20);

            respostaDaQuestao = tipos[tipo].calc(a,b,c,d);
            respostaDaQuestao = Number(respostaDaQuestao.toFixed(2));
            let vetorResposta = fazVetorResposta(respostaDaQuestao);

            // escreve respostas possíveis
            textoDasRespostas(vetorResposta);

            let questao = tipos[tipo].texto.replaceAll("a", a).replaceAll("b", b).replaceAll("c", c).replaceAll("d", d);

            console.log("Resposta da questão:", respostaDaQuestao);

            return questao;
        }

        function sistemasDeEquacoes() {
            questao = "Encontre o valor de x em:<br>a1x + b1y = c1<br>a2x + b2y = c2";
            let a1 = getRandomInt(1,10);
            let b1 = getRandomInt(1,10);
            let c1 = getRandomInt(1,10);
            let a2 = getRandomInt(1,10);
            let b2 = getRandomInt(1,10);
            let c2 = getRandomInt(1,10);

            let y = (a1 * c2 - a2 * c1) / (a1 * b2 - a2 * b1);
            y = y.toFixed(2);
            let x = (c1 - b1 * y) / a1;
            x = x.toFixed(2);

            respostaDaQuestao = x;

            console.log("Valores das variáveis:", a1, b1, c1, a2, b2, c2, x, y);

            questao = questao.replaceAll("a1", a1).replaceAll("b1", b1).replaceAll("c1", c1).replaceAll("a2", a2).replaceAll("b2", b2).replaceAll("c2", c2);

            let vetorResposta = fazVetorResposta(respostaDaQuestao);
            textoDasRespostas(vetorResposta);

            console.log("Resposta da questão:", x, y);

            return questao;
        }

        function simplificarFracao() {
            let numerador = getRandomInt(1,100);
            let denominador = getRandomInt(1,100);
            respostaDaQuestao = `${numerador} / ${denominador}`;

            let fator1 = getRandomInt(1,4);
            let fator2 = getRandomInt(2,5);
            denominador = denominador * fator1 * fator2;
            numerador = numerador * fator1 * fator2;
            let questao = `Simplifique a fração: <br> 
            <span class="fracao">
                <span class="topo">${numerador}</span>
                <span class="linha"></span>
                <span class="base">${denominador}</span>
            </span>`;
            
            let vetorResposta = fazVetorRespostaFracao(numerador, denominador, fator1 * fator2);
            textoDasRespostas(vetorResposta);

            console.log("Resposta da questão:", respostaDaQuestao);

            return questao;
        }

        function expressaoDeFracao() {
            let numerador1 = getRandomInt(1,15);
            let denominador1 = getRandomInt(1,15);
            let numerador2 = getRandomInt(1,15);
            let denominador2 = getRandomInt(1,15);
            let fator1 = numerador1 * denominador2 + numerador2 * denominador1;
            let fator2 = denominador1 * denominador2;

            console.log("Fatores:", fator1 % fator2);

            // declare vetorResposta in outer scope so it's available after the if/else
            let vetorResposta;

            if (fator1 % fator2 === 0) {
                console.log("A resposta é um número inteiro.");
                respostaDaQuestao = fator1 / fator2;
                vetorResposta = fazVetorResposta(respostaDaQuestao);
            } else {
                [fator1, fator2] = simplificadorDeFracao(fator1, fator2);
                respostaDaQuestao = `${fator1} / ${fator2}`;
                vetorResposta = fazVetorRespostaFracao(fator1, fator2, 1);
            }
            console.log("Banana");
            textoDasRespostas(vetorResposta);

            let questao = `Simplifique a fração: <br> 
            <span class="fracao">
                <span class="topo">${numerador1}</span>
                <span class="linha"></span>
                <span class="base">${denominador1}</span>
            </span>
            +
            <span class="fracao">
                <span class="topo">${numerador2}</span>
                <span class="linha"></span>
                <span class="base">${denominador2}</span>
            </span>`;
            
            console.log("Resposta da questão:", respostaDaQuestao);

            return questao;
        }

        function potenciacao() {
            let a = getRandomInt(1,10);
            let b = getRandomInt(1,5);
            respostaDaQuestao = Math.pow(a, b);
            vetorResposta = fazVetorResposta(respostaDaQuestao);
            textoDasRespostas(vetorResposta);

            let questao = `${a}<sup>${b}</sup>`;
            return questao;
        }

        function raizQuadrada() {
            respostaDaQuestao = getRandomInt(1,50);
            let numero = respostaDaQuestao * respostaDaQuestao;
            
            vetorResposta = fazVetorResposta(respostaDaQuestao);
            textoDasRespostas(vetorResposta);

            let questao = `√${numero}`;
            return questao;
        }

        function expressoesRaizPotenciacao() {
            const tipos = [
                {
                    texto: "√a + √b - c + d",
                    a: Math.pow(getRandomInt(1,10), 2),
                    b: Math.pow(getRandomInt(1,10), 2),
                    c: getRandomInt(1,20),
                    d: getRandomInt(1,20),
                    calc: (a,b,c,d) => Math.sqrt(a) + Math.sqrt(b) - c + d
                },
                {
                    texto: "b x √(a) - (c x d)<sup>2</sup>",
                    a: Math.pow(getRandomInt(1,10), 2),
                    b: getRandomInt(1,10),
                    c: getRandomInt(1,20),
                    d: getRandomInt(1,20),
                    calc: (a,b,c,d) => b * Math.sqrt(a) - Math.pow((c * d), 2)
                },
                {
                    texto: "a + b - √c + d<sup>2</sup>",
                    a: getRandomInt(1,10),
                    b: getRandomInt(1,10),
                    c: Math.pow(getRandomInt(1,20), 2),
                    d: getRandomInt(1,20),
                    calc: (a,b,c,d) => a + b - Math.sqrt(c) + Math.pow(d, 2)
                },
                {
                    texto: "a + b + c - √d",
                    a: getRandomInt(1,10),
                    b: getRandomInt(1,10),
                    c: getRandomInt(1,20),
                    d: Math.pow(getRandomInt(1,20), 2),
                    calc: (a,b,c,d) => a + b + c - Math.sqrt(d)
                },
                {
                    texto: "5 x a ÷ (b<sup>2</sup> + c + d)",

        function equacaoQuadraticaSimples() {
            let a = getRandomInt(1,10);
            let b = getRandomInt(1,10);
            let c = getRandomInt(1,10);
            let x = getRandomInt(-10,10);
            let tipo = getRandomInt(1, 4);
            let d = 0;
            let questao = "";

            if (tipo === 1) {
                d = a * Math.pow(x, 2) + b * x + c;
                questao = `${a}x<sup>2</sup> + ${b}x + ${c} = ${d}`;
            } else if (tipo === 2) {
                d = a * Math.pow(x, 2) - b * x + c;
                questao = `${a}x<sup>2</sup> - ${b}x + ${c} = ${d}`;
            } else if (tipo === 3) {
                d = a * Math.pow(x, 2) - b * x - c;
                questao = `${a}x<sup>2</sup> - ${b}x - ${c} = ${d}`;
            } else if (tipo === 4) {
                d = -a * Math.pow(x, 2) + b * x + c;
                questao = `-${a}x<sup>2</sup> + ${b}x + ${c} = ${d}`;
            }

            respostaDaQuestao = x;
            vetorResposta = fazVetorResposta(respostaDaQuestao);
            textoDasRespostas(vetorResposta);

            console.log("Resposta da questão:", respostaDaQuestao);

            questao = questao.replaceAll("a", a).replaceAll("b", b).replaceAll("c", c).replaceAll("d", d);

            questao = `Das opções abaixo, qual é um possível valor de "x"?<br>${questao}`;

            return questao;
        }

        function fazVetorResposta(resposta) {
            let tipo = getRandomInt(1, 4);

            if (!Number.isInteger(resposta)) {
                if (tipo === 1) {
                    return [resposta,( resposta*0.9).toFixed(2), (resposta*1.1).toFixed(2), (resposta*1.2).toFixed(2)];
                } else if (tipo === 2) {
                    return [(resposta*1.2).toFixed(2), resposta, (resposta*0.9).toFixed(2), (resposta*0.8).toFixed(2)];
                } else if (tipo === 3){
                    return [(resposta*1.4).toFixed(2), (resposta*0.9).toFixed(2), resposta, (resposta*1.1).toFixed(2)];
                } else if (tipo === 4) {
                    return [(resposta*1.1).toFixed(2), (resposta*0.9).toFixed(2), (resposta*0.8).toFixed(2), resposta];
                }
            } else if (resposta < 200) {
                if (tipo === 1) {
                    return [resposta, resposta + 1, resposta -1, resposta + 2];
                } else if (tipo === 2) {
                    return [resposta + 1, resposta, resposta + 2, resposta -1];
                } else if (tipo === 3){
                    return [resposta -1, resposta + 2, resposta, resposta - 2];
                } else if (tipo === 4) {
                    return [resposta + 2, resposta -1, resposta - 2, resposta];
                }
            } else {
                if (tipo === 1) {
                    return [resposta, resposta + 120, resposta - 10, resposta + 10];
                } else if (tipo === 2) {
                    return [resposta + 40, resposta, resposta - 20, resposta - 120];
                } else if (tipo === 3){
                    return [resposta - 110, resposta + 20, resposta, resposta + 40];
                } else if (tipo === 4) {
                    return [resposta + 120, resposta -10, resposta - 20, resposta];
                }
            }
        }

        function fazVetorRespostaFracao(numerador, denominador, fator) {
            let tipo = getRandomInt(1, 4);
            console.log("Fator de simplificação:", numerador, denominador, fator);
            numerador = numerador / fator;
            denominador = denominador / fator;

            if (tipo === 1) {
                return [`${numerador} / ${denominador}`, `${numerador + 1} / ${denominador + 1}`, `${numerador - 1} / ${denominador - 1}`, `${numerador + 2} / ${denominador + 2}`];
            } else if (tipo === 2) {
                return [ `${numerador + 1} / ${denominador + 1}`, `${numerador} / ${denominador}`, `${numerador - 1} / ${denominador - 1}`, `${numerador + 2} / ${denominador + 2}`];
            } else if (tipo === 3){
                return [`${numerador - 1} / ${denominador - 1}`, `${numerador + 2} / ${denominador + 2}`, `${numerador} / ${denominador}`, `${numerador - 2} / ${denominador - 2}`];
            } else if (tipo === 4) {
                return [`${numerador + 2} / ${denominador + 2}`, `${numerador + 1} / ${denominador - 1}`, `${numerador - 2} / ${denominador - 1}`, `${numerador} / ${denominador}`];
            }
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

            var paragrafo = document.getElementById(letra);

            if (paragrafo) {
                console.log(paragrafo.textContent + " - " + respostaDaQuestao);
                console.log(paragrafo.textContent === respostaDaQuestao);
                if (paragrafo.textContent === respostaDaQuestao) {

                }
                score.textContent = `C/E: ${questoesCertas} / ${totalQuestoes}`;
            } else {
                console.log("No paragraph found with id: " + letra);
            }
        }

        function simplificadorDeFracao(numerador, denominador) {
            let num = 2;
            while (true) {
                if (numerador % num === 0 && denominador % num === 0) {
                    numerador = numerador / num;
                    denominador = denominador / num;
                } else {
                    num++;
                }

                if (num > Math.min(numerador, denominador)) {
                    break;
                }
            }
            return [numerador, denominador];
        }

        function timer() {
            setInterval(() => {
                if (tempoRestante > 0) {
                    tempoRestante--;
                    var timerElement = document.getElementById('timer');
                    timerElement.textContent = `timer: ${tempoRestante}`;
                }
            }, 1000);
        }

        function calculaPontos() {
            if (tempoRestante > 50) {
                pontos += 6;
            } else if (tempoRestante > 40) {
                pontos += 5;
            } else if (tempoRestante > 30) {
                pontos += 4;
            } else if (tempoRestante > 20) {
                pontos += 3;
            } else if (tempoRestante > 10) {
                pontos += 2;
            } else {
                pontos += 1;
            }
        }
